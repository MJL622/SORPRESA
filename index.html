<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una carta para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070f26;--bg2:#12275e;--gold:#f2b84b;--ice:#eaf2ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 100%,var(--bg2),var(--bg) 70%);color:var(--ice);font-family:Quicksand,system-ui,sans-serif;text-align:center;overflow-x:hidden}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.2rem .8rem}
/* Sobre */
#env{position:relative;width:min(260px,72vw);height:min(170px,47vw);margin:0 auto;cursor:pointer;transition:opacity .6s,transform .6s}
#env .back{position:absolute;inset:0;background:#3c66c9;border-radius:6px}
#env .front{z-index:2;position:absolute;inset:0;background:#5b87e6;border-radius:6px;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
#env .flap{position:absolute;left:0;right:0;top:0;height:60%;background:#4a76d8;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease;z-index:3}
#env.open .flap{transform:rotateX(180deg);z-index:0}
#env .paper{position:absolute;left:8%;right:8%;top:6%;bottom:8%;background:#f6f9ff;border-radius:4px;transition:transform .8s .5s;z-index:1}
#env.open .paper{transform:translateY(-45%)}
#env.gone{opacity:0;transform:scale(.9)}
#start{position:absolute;left:50%;top:48%;translate:-50% -50%;z-index:4;width:54px;height:54px;border-radius:50%;background:var(--gold);font-size:1.4rem;display:flex;align-items:center;justify-content:center;animation:pulse 2s infinite}
#env.open #start{animation:none;opacity:0}
#env:focus-visible,#bq:focus-visible{outline:3px solid #fff;outline-offset:3px}
#hint{color:#cfe0ff;margin-top:.9rem;font-size:.95rem}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(242,184,75,0)}100%{box-shadow:0 0 0 0 rgba(242,184,75,0)}}
/* Carta oscura */
#letter{display:block;width:min(520px,100%);border-radius:10px;padding:1.4rem .6rem 1.4rem;background:linear-gradient(#0a1533,#0d1d47);border:1px solid rgba(127,178,255,.35);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(60,120,255,.15);transform-origin:top;animation:unfold 1s ease-out both}
@keyframes unfold{from{transform:perspective(900px) rotateX(-90deg);opacity:0}to{transform:none;opacity:1}}
#letter h1{font-family:"Great Vibes","Snell Roundhand",cursive;font-weight:400;font-size:2.8rem;margin:0;color:#cfe4ff}
#bq{width:100%;height:auto;display:block;overflow:visible}
.stem{fill:none;stroke:#8fbcff;stroke-width:2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s ease-out;filter:drop-shadow(0 0 3px #3c8cff)}
.on .stem{stroke-dashoffset:0}
.fl{transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-60deg);transition:transform 1s cubic-bezier(.3,1.5,.5,1) .8s;filter:drop-shadow(0 0 6px rgba(60,140,255,.85))}
.on .fl{transform:none}
.car{transition:transform 1.8s cubic-bezier(.2,.8,.25,1),opacity .4s}
.wh{transform-box:fill-box;transform-origin:center}
.drive .wh{animation:rot .3s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#msg{font-family:"Dancing Script","Brush Script MT",cursive;font-weight:700;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.3;min-height:6.2rem;display:flex;align-items:center;justify-content:center;padding:0 .8rem;margin-top:.2rem}
#msg.swap{animation:in .8s both}
#msg.last{color:var(--gold);font-size:clamp(1.7rem,6.4vw,2.4rem)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#tap{font:700 1.1rem Quicksand,system-ui,sans-serif;color:#fff;background:linear-gradient(#ff8a2b,#e5620f);border:0;border-radius:999px;padding:.9rem 2.2rem;margin-top:.8rem;cursor:pointer;box-shadow:0 6px 18px rgba(255,122,26,.45)}
#tap:active{transform:scale(.96)}
#count{font-size:.85rem;opacity:.7;margin-top:.5rem;min-height:1.2em}
@media (prefers-reduced-motion:reduce){#start{animation:none}#letter{animation:none}.stem,.fl,.car{transition:none}.drive .wh{animation:none}}

#ver{display:none;font:700 1.1rem Quicksand,system-ui,sans-serif;color:#fff;background:linear-gradient(#e5484d,#b3232f);border:0;border-radius:999px;padding:.9rem 2.2rem;margin-top:.8rem;cursor:pointer;box-shadow:0 6px 18px rgba(229,72,77,.5);animation:in .9s both}
#cerrar:focus-visible{outline:3px solid #fff;outline-offset:3px}
#carta{position:fixed;inset:0;z-index:20;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;background:rgba(4,9,24,.88);padding:calc(1.2rem + env(safe-area-inset-top,0px)) 1rem calc(1.5rem + env(safe-area-inset-bottom,0px))}
#papel{position:relative;width:min(480px,100%);margin:auto;padding:2.6rem 1.6rem 2.2rem;color:#2b2f45;text-align:left;border-radius:4px;
background:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.7),transparent 50%),radial-gradient(ellipse at 90% 95%,rgba(200,170,120,.25),transparent 55%),#fbf5e6;
box-shadow:0 25px 60px rgba(0,0,0,.6),inset 0 0 40px rgba(170,130,70,.18);transform-origin:top;animation:unfold 1.1s ease-out both}
#papel::before{content:"";position:absolute;inset:10px;border:1.5px solid rgba(74,132,240,.35);border-radius:2px;pointer-events:none}
#papel .flores{display:flex;justify-content:center;gap:.2rem;margin-bottom:.4rem}
#papel .flores svg{width:34px;height:34px}
#papel .fecha{font-family:"Dancing Script","Brush Script MT",cursive;font-weight:600;font-size:1.2rem;text-align:right;color:#5a6488;margin:.2rem .3rem 0}
#papel h2{font-family:"Great Vibes","Snell Roundhand",cursive;font-weight:400;font-size:2.6rem;margin:.2rem 0 .8rem;color:#1d3f9e;text-align:center}
#papel p{font-family:"Dancing Script","Brush Script MT",cursive;font-weight:600;font-size:1.32rem;line-height:1.55;margin:0 0 .9rem;opacity:0;animation:in 1s forwards}
#papel .firma{font-family:"Great Vibes","Snell Roundhand",cursive;font-weight:400;font-size:2.2rem;text-align:right;color:#1d3f9e;margin:1rem .4rem 0;line-height:1.1}
#papel .sello{position:absolute;left:50%;bottom:-26px;translate:-50% 0;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ea5a5f,#a81e28 70%);box-shadow:0 4px 10px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#ffd9dc}
#cerrar{display:block;margin:2.6rem auto 0;font:700 1rem Quicksand,system-ui,sans-serif;color:#cfe4ff;background:transparent;border:1.5px solid rgba(207,228,255,.5);border-radius:999px;padding:.6rem 1.6rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){#papel{animation:none}#papel p,#ver{animation:none;opacity:1}}
#bq{cursor:pointer;-webkit-tap-highlight-color:transparent}
#bq:focus-visible{outline:2px solid #8fbcff;outline-offset:4px;border-radius:12px}
#pulso{transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(4);opacity:0}}
#sobreBox{display:none;margin-top:3.2rem;animation:in .9s both}
@media (prefers-reduced-motion:reduce){#pulso{animation:none}}
</style>
</head>
<body>
<main>
  
  </div>
  <article id="letter">
    <h1>Para ti 💙</h1>
    <svg id="bq" viewBox="0 0 400 400" role="button" tabindex="0" aria-label="Toca el ramo para ver la siguiente flor">
      <defs><radialGradient id="glow"><stop offset="0" stop-color="#2f6bff" stop-opacity=".28"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient></defs>
      <ellipse cx="200" cy="200" rx="200" ry="190" fill="url(#glow)"/>
      <g id="plants"></g>
      <path d="M10 316 Q90 392 200 374" fill="none" stroke="#ff7a1a" stroke-width="8" stroke-linecap="round"/>
      <path d="M10 316 Q90 392 200 374" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2" stroke-dasharray="9 9"/>
      <path d="M200 374 Q310 392 390 310" fill="none" stroke="#ffc21a" stroke-width="8" stroke-linecap="round"/>
      <path d="M200 374 Q310 392 390 310" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2" stroke-dasharray="9 9"/>
      <circle id="pulso" cx="200" cy="366" r="9" fill="none" stroke="#ffc21a" stroke-width="2"/>
      <circle cx="200" cy="366" r="7" fill="#ffc21a" style="filter:drop-shadow(0 0 6px #ffc21a)"/>
    </svg>
    <div id="msg" aria-live="polite">Toca el ramo para empezar 💙</div>
    <div id="count"></div>
    <div id="sobreBox">
      <div id="env" role="button" tabindex="0" aria-label="Abrir la carta">
        <div class="back"></div><div class="paper"></div><div class="front"></div><div class="flap"></div>
        <span id="start" aria-hidden="true">💌</span>
      </div>
      <div id="hint">Toca el sobre para abrirlo.</div>
    </div>
  </article>
  <div id="carta" role="dialog" aria-modal="true" aria-label="Tu carta">
    <div>
      <div id="papel"></div>
      <button id="cerrar">Volver al ramo</button>
    </div>
  </div>
</main>
<script>
// ✏️ Un mensaje por flor. El último es el final.
const mensajes = [
  "Me gustan esos planes que poco a poco vamos dejando por hacer.",
  "Tus ojos tienen una forma muy tuya de llamar la atención.",
  "Tu sonrisa siempre le da algo bonito al momento.",
  "Qué bonito haber coincidido con alguien como tú.",
  "Me gustan nuestras charlas, tu voz y la forma en que cuentas las cosas.",
  "Tienes esa forma de construir ideas que dice mucho de ti.",
  "Y qué bonito seguir descubriendo todo eso que te hace ser tú. 💙"
];
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const NS = "http://www.w3.org/2000/svg";
const O = [200,364];
// Orden de aparición: de afuera hacia el centro, el último es la flor grande
const angs = [-60,60,-40,40,-20,20,0];

// Flores: capas de pétalos [cantidad, rx, ry, distancia, color, giro]
const flores = [
  {L:[[8,8,8,14,"#a9ccff",0],[5,8,8,6,"#d7e8ff",0]],c:[5,"#7fb2ff"],s:1},
  {L:[[8,4.5,15,15,"#2f5fc4",0],[8,3.5,11,11,"#5a92f5",22.5]],c:[5,"#ffc21a"],s:1},
  {L:[[6,8,14,14,"#cfe4ff",0],[6,5,9,9,"#7fb2ff",30]],c:[5,"#22c3ff"],s:1},
  {L:[[10,8,13,13,"#22b4ff",0],[8,7,11,9,"#1d7bff",20],[6,5,7,5,"#8fd8ff",0]],c:[3,"#fff"],s:1.05},
  {L:[[7,5.5,15,15,"#8fb8ff",0],[7,4,10,10,"#d7e8ff",25]],c:[4,"#4a84f0"],s:1},
  {L:[[5,9,13,13,"#bcd9ff",0]],c:[6,"#ffc21a"],s:1.05},
  {L:[[12,9,15,17,"#1e4fd0",0],[10,8,12,12,"#2f7bff",18],[8,6,8,7,"#7fc4ff",0]],c:[5,"#fff"],s:1.5}
];
function flowerSVG(k){
  const f = flores[k]; let p = "";
  f.L.forEach(([n,rx,ry,d,fill,rot]) => { for(let i=0;i<n;i++) p += `<ellipse cx="0" cy="${-d}" rx="${rx}" ry="${ry}" fill="${fill}" transform="rotate(${rot+i*360/n})"/>`; });
  return `<g transform="scale(${f.s*0.85})">${p}<circle r="${f.c[0]}" fill="${f.c[1]}"/></g>`;
}

// Carritos estilo Hot Wheels: [color, sombra, franja]
const autos = [
  ["#1d7bff","#0a3fa8","#ff7a1a"],["#ff7a1a","#a8430a","#1d7bff"],["#20b8d8","#0a6a88","#ffc21a"],
  ["#2f5fc4","#12285f","#ffc21a"],["#1d7bff","#0a3fa8","#ffc21a"],["#3fa7ff","#1b5db0","#ff7a1a"],["#1a45c8","#0b1f66","#ff7a1a"]
];
function star(cx,cy,R,r){ let a=[]; for(let i=0;i<10;i++){const q=(i%2?r:R),t=-Math.PI/2+i*Math.PI/5;a.push((cx+q*Math.cos(t)).toFixed(1)+","+(cy+q*Math.sin(t)).toFixed(1));} return a.join(" "); }
function carSVG(k){
  const [c,d,s] = autos[k];
  const wheel = cx => `<circle cx="${cx}" cy="33" r="8.5" fill="#0b0b0f"/><g class="wh"><circle cx="${cx}" cy="33" r="6" fill="#e6ebf5"/><polygon points="${star(cx,33,5,2.2)}" fill="#2a2d38"/></g>`;
  return `<g transform="translate(-60,-22)">
  <defs><linearGradient id="cg${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${d}"/></linearGradient></defs>
  <ellipse cx="60" cy="41" rx="52" ry="3" fill="#000" opacity=".45"/>
  <path d="M4 30 L8 24 Q10 20 20 19 L40 17 Q50 8 64 7 L84 7 Q94 8 100 16 L112 19 Q118 21 118 27 L118 31 Q118 33 115 33 L7 33 Q4 33 4 30Z" fill="url(#cg${k})"/>
  <path d="M46 17 Q54 10 64 10 L72 10 L72 17Z M76 10 L84 10 Q90 11 95 17 L76 17Z" fill="#0b1a3f" stroke="#9cc6ff" stroke-width=".8"/>
  <path d="M8 26 L112 23.5 L112 26.5 L8 29Z" fill="${s}"/>
  <path d="M3 20 L18 18.5 L18 21.5 L3 23Z" fill="${s}"/>
  <path d="M22 20 Q60 15 100 19" stroke="#fff" stroke-opacity=".4" stroke-width="1.4" fill="none"/>
  <ellipse cx="115" cy="25" rx="3" ry="2" fill="#fff6c9"/>
  ${wheel(28)}${wheel(92)}</g>`;
}

function crecerRamo(k){
  const a = angs[k]*Math.PI/180;
  const F = [200+165*Math.sin(a), O[1]-(110+167*Math.cos(a))];
  const g = document.createElementNS(NS,"g");
  const cx = O[0]+(F[0]-O[0])*0.35, cy = O[1]-(O[1]-F[1])*0.65;
  const fr = [.55,.55,.78,.78,.3,.3,.55][k];
  const P = [O[0]+(F[0]-O[0])*fr, O[1]+(F[1]-O[1])*fr];
  const der = F[0] >= O[0];
  const tilt = der ? -22 : 22, sx = der ? 1 : -1, sc = 0.58;
  g.innerHTML = `<path class="stem" pathLength="1" d="M${O[0]} ${O[1]} Q${cx} ${cy} ${F[0]} ${F[1]}"/>
    <g transform="translate(${F[0]} ${F[1]})"><g class="fl">${flowerSVG(k)}</g></g>
    <g class="car" style="opacity:0;transform:translate(${O[0]}px,${O[1]}px) rotate(${tilt}deg) scale(${.2*sx},.2)">${carSVG(k)}</g>`;
  $("plants").appendChild(g);
  const car = g.querySelector(".car");
  void car.getBoundingClientRect();
  g.classList.add("on");
  car.style.opacity = 1;
  car.style.transform = `translate(${P[0]}px,${P[1]}px) rotate(${tilt}deg) scale(${sc*sx},${sc})`;
  return car;
}

let paso = 0, busy = false, abierto = false;

async function siguiente(){
  if (busy || paso >= mensajes.length) return;
  busy = true;
  const pulso = $("pulso"); if (pulso) pulso.remove();
  const n = paso++, esUltima = n === mensajes.length-1;
  $("bq").classList.add("drive");
  crecerRamo(n);
  const m = $("msg"); m.classList.remove("swap"); void m.offsetWidth;
  m.textContent = mensajes[n]; m.classList.add("swap");
  if (esUltima) m.classList.add("last");
  $("count").textContent = esUltima ? "" : (n+1) + " de " + mensajes.length + ". Toca el ramo para seguir.";
  await wait(1900);
  $("bq").classList.remove("drive");
  if (esUltima){
    $("bq").removeAttribute("role"); $("bq").removeAttribute("tabindex"); $("bq").style.cursor = "default";
    await wait(1800);
    $("sobreBox").style.display = "block";
    $("sobreBox").scrollIntoView({behavior:"smooth", block:"center"});
  }
  busy = false;
}
$("bq").addEventListener("click", siguiente);
$("bq").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); siguiente(); } });

async function abrirSobre(){
  if (abierto){ abrirLaCarta(); return; }
  abierto = true;
  $("hint").style.display = "none";
  $("env").classList.add("open");
  await wait(1700);
  abrirLaCarta();
}
$("env").addEventListener("click", abrirSobre);
$("env").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); abrirSobre(); } });

// ✏️ Tu carta final: cambia el nombre, los párrafos y la firma
const carta = {
  fecha: "30 de septiembre 💙",
  para: "Querido Jhon",
  parrafos: [
    "Quise regalarte estas flores de una manera un poquito diferente.",
    "No son flores que puedas guardar en un florero, pero sí espero que puedan guardar un pequeño momento bonito de este día.",
    "Me gusta todo lo que hemos ido compartiendo y la forma en la que, poquito a poquito, nos hemos ido conociendo. Hay personas con las que simplemente se siente bonito coincidir, y tú eres una de ellas.",
    "Así que estas flores son para ti, con mucho cariño."
  ],
  firma: "-Majo"
};
function abrirLaCarta(){
  const flores = [0,1,2,3,4].map(k => `<svg viewBox="-34 -34 68 68">${flowerSVG(k)}</svg>`).join("");
  let d = 0.9;
  const ps = carta.parrafos.map(t => `<p style="animation-delay:${(d+=1.1).toFixed(1)}s">${t}</p>`).join("");
  $("papel").innerHTML = `<div class="flores">${flores}</div><div class="fecha">${carta.fecha}</div><h2>${carta.para}</h2>${ps}<div class="firma" style="opacity:0;animation:in 1s ${(d+1.2).toFixed(1)}s forwards">${carta.firma}</div><div class="sello" aria-hidden="true">♥</div>`;
  $("carta").style.display = "flex";
  $("carta").scrollTop = 0;
  $("cerrar").focus({preventScroll:true});
}
$("cerrar").addEventListener("click", () => { $("carta").style.display = "none"; });
</script>
</body>
</html>
